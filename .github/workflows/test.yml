name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macOS: the tests were written against BSD tools and bash 3.2.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The replay eval tests replay against an older commit of this repo (evals/replay/support.py BASE_REF).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every check
        # test-all.sh keeps its temp tree (each group's full output) when a check fails.
        run: |
          mkdir -p "$RUNNER_TEMP/test-all"
          TMPDIR="$RUNNER_TEMP/test-all" bash scripts/test-all.sh
      - name: Upload the kept test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-all-output
          path: ${{ runner.temp }}/test-all/
          retention-days: 7
